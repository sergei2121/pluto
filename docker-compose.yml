# ─── PLUTO: серверная часть (Ubuntu / Docker Compose) ────────────────────────
# Установка:
#   git clone https://github.com/pluto-monitor/pluto.git && cd pluto
#   cp .env.example .env   # отредактируйте секреты
#   docker compose up -d
# Консоль: http://<хост>:8080 · вход admin / $ADMIN_PASSWORD

services:
  core:
    image: ghcr.io/pluto-monitor/core:1.4
    build: ./server
    restart: unless-stopped
    ports:
      - "8080:8080"   # веб-консоль + REST API
      - "8443:8443"   # WebSocket-шлюз агентов (TLS)
    environment:
      DATABASE_URL: postgres://pluto:${DB_PASS}@db:5432/pluto
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - core-data:/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pluto
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: pluto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluto"]
      interval: 5s
      retries: 10
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  core-data:
  pg-data:
