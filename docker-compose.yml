services:
  core:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: pluto/core:1.9.3
    container_name: pluto-core
    restart: unless-stopped
    # Файл .env НЕ обязателен: Docker Compose подхватит его автоматически, если
    # он лежит рядом с этим файлом; без него действуют значения по умолчанию.
    environment:
      - DATA_DIR=/data
      - HTTP_PORT=8080
      - AGENT_PORT=8443
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-pluto}
    ports:
      # Хостовые порты настраиваются в .env (PLUTO_HTTP_PORT, PLUTO_AGENT_PORT),
      # чтобы не конфликтовать с другими сервисами (например, zabbix-web на 8080).
      # Внутри контейнера порты всегда 8080/8443.
      - "${PLUTO_HTTP_PORT:-8080}:8080"   # веб-консоль + REST API
      - "${PLUTO_AGENT_PORT:-8443}:8443"  # шлюз агентов (WebSocket)
    volumes:
      - pluto-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 4s
      retries: 3

volumes:
  pluto-data:
