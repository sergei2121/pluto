services:
  core:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: pluto/core:2.0.0
    restart: unless-stopped
    ports:
      # Консоль + API. Если 8080 занят (например, Zabbix) — задайте PLUTO_HTTP_PORT в .env
      - "${PLUTO_HTTP_PORT:-8080}:8080"
      # Публичная витрина (без входа). Порт задаётся в «Настройки → Витрина» и здесь.
      - "${PLUTO_SHOWCASE_PORT:-8081}:${PLUTO_SHOWCASE_PORT:-8081}"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-pluto}
      - TZ=${TZ:-Europe/Moscow}
      - SHOWCASE_PORT=${PLUTO_SHOWCASE_PORT:-8081}
    volumes:
      - pluto-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 4s
      retries: 3

volumes:
  pluto-data:
